<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#06132d">
<title>Rush – Bursdag</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#06132d;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{position:relative}
#screen{position:fixed;left:0;top:0;width:100%;height:100%;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:3.2vh 4vw 4vh;background:radial-gradient(ellipse at 12% 12%,rgba(35,255,0,.86) 0%,rgba(0,180,65,.34) 23%,transparent 46%),radial-gradient(ellipse at 92% 18%,rgba(0,115,255,.72) 0%,transparent 44%),radial-gradient(ellipse at 78% 95%,rgba(0,70,255,.92) 0%,transparent 52%),linear-gradient(135deg,#031326 0%,#06245a 48%,#03112b 100%)}
/* Decorative Rush colour ribbons */
#screen:before{content:"";position:absolute;left:-12%;right:-12%;top:37%;height:26%;border-top:clamp(3px,.45vh,7px) solid rgba(0,220,255,.72);border-radius:50%;transform:rotate(-8deg);filter:drop-shadow(0 0 12px #00cfff);pointer-events:none}
#screen:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-14%;height:38%;border-top:clamp(3px,.5vh,8px) solid rgba(0,105,255,.8);border-radius:50%;transform:rotate(-7deg);box-shadow:0 -8px 25px rgba(0,130,255,.25);pointer-events:none}
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(28px);opacity:.6}
.glow.green{width:28vw;height:28vw;left:-10vw;top:-12vw;background:#65ff00}
.glow.red{width:18vw;height:18vw;right:-7vw;top:5vh;background:#ed003c;opacity:.22}
.glow.blue{width:34vw;height:25vw;right:-12vw;bottom:-12vw;background:#005dff}
header{position:relative;z-index:2;width:100%;flex:0 0 auto;text-align:center;display:flex;flex-direction:column;align-items:center;margin:0 0 2.8vh}
#rushLogo{display:block;width:clamp(150px,17vw,360px);height:auto;max-height:12vh;object-fit:contain;margin:0 auto 1.2vh;filter:drop-shadow(0 4px 0 rgba(220,0,50,.35))}
h1{margin:0;padding:0;text-align:center;font-size:5.2vw;line-height:.98;font-weight:1000;letter-spacing:-.035em;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,20,50,.55),0 0 18px rgba(0,0,0,.24)}
h1 span{display:block}
h1 .white{color:#fff}
h1 .green{color:#a6ff00;text-shadow:0 3px 0 #317800,0 0 18px rgba(128,255,0,.38)}
.accent{width:42%;height:clamp(4px,.7vh,9px);margin:1.7vh auto 0;border-radius:99px;background:linear-gradient(90deg,#e5003d 0%,#a6ff00 36%,#00e0ff 100%);box-shadow:0 0 16px rgba(0,220,255,.7)}
#names{position:relative;z-index:2;flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;padding:1vh 1vw;gap:1.4vw;overflow:hidden}
#names.single{display:flex;flex-direction:row;align-items:center;justify-content:center}
#names.single .namebox{width:78%;height:58%;max-width:1500px;min-height:0}
#names.multiple{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.8vh 1.2vw;align-items:stretch;justify-items:stretch}
#names.multiple .namebox{width:100%;height:100%}
.namebox{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:2vh 2vw;border:clamp(3px,.32vw,7px) solid #00dfff;border-radius:clamp(18px,2.2vw,38px);background:linear-gradient(145deg,rgba(5,27,67,.96),rgba(2,10,42,.94));box-shadow:0 0 18px rgba(0,220,255,.65),0 0 42px rgba(0,95,255,.24),inset 0 0 28px rgba(0,105,255,.24);overflow:hidden;text-align:center}
.namebox:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(237,0,60,.14),transparent 28%,rgba(0,210,255,.1));pointer-events:none}
.namebox span{position:relative;z-index:1;display:block;width:100%;font-size:4.1vw;line-height:1.05;font-weight:1000;letter-spacing:-.025em;text-transform:uppercase;text-align:center;color:#fff;text-shadow:0 3px 0 #061a42,0 0 15px rgba(0,210,255,.3);overflow-wrap:anywhere}
#names.multiple .namebox span{font-size:2.65vw}
#tvSyncStatus{display:none}
#toolbar{position:fixed;top:8px;right:8px;z-index:20;opacity:.15}
#editor{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.76);align-items:center;justify-content:center;padding:20px}
#editor.open{display:flex}
#panel{width:min(680px,94vw);max-height:90vh;overflow:auto;background:#081b3b;border:2px solid #00dfff;border-radius:18px;padding:24px;box-shadow:0 0 30px #00bfff55}
#panel h2{margin:0 0 8px;font-size:26px}#panel p{color:#d8e8ff}
#fields .row{display:flex;gap:8px;margin:10px 0}#fields input{flex:1;min-width:0;padding:12px;font-size:18px;border-radius:8px;border:1px solid #7aa8ce}
button{padding:11px 16px;border:0;border-radius:8px;background:#a6ff00;color:#07152b;font-weight:bold;cursor:pointer}
#fields button,.actions button{margin:3px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
@media (orientation:portrait){#screen{padding:2.5vh 4vw}#rushLogo{width:30vw;max-height:10vh}h1{font-size:7vw}#names.multiple{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(auto-fit,minmax(0,1fr))}#names.multiple .namebox span{font-size:4vw}#names.single .namebox{width:90%;height:50%}.namebox span{font-size:6vw}}
</style>
</head>

<main id="screen">

  projectId: "rush-storskjerm",
  storageBucket: "rush-storskjerm.firebasestorage.app",
  messagingSenderId: "744520048601",
  appId: "1:744520048601:web:6451390a759d77c8ae03c8",
  measurementId: "G-MMREKWKP5S"
};
const ADMIN_EMAIL = "haugesund@rushtrampolinepark.no";
const ADMIN_MODE = new URLSearchParams(location.search).get("admin") === "1";
const CACHE_KEY = "rush-birthday-portrait-v1";

const namesEl = document.getElementById("names");
const fields = document.getElementById("fields");
const editor = document.getElementById("editor");
const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("loginBtn");
const editBtn = document.getElementById("editBtn");
const logoutBtn = document.getElementById("logoutBtn");

let names = ["Navn"];
let currentUser = null;

function setStatus(message) {
  if (statusEl) statusEl.textContent = message;
  const tvStatus = document.getElementById("tvSyncStatus");
  if (tvStatus) tvStatus.textContent = message;
}
function render() {
  while (namesEl.firstChild) namesEl.removeChild(namesEl.firstChild);
  var count = Math.max(names.length, 1);
  namesEl.className = count === 1 ? "single" : "multiple";
  namesEl.style.display = count === 1 ? "flex" : "grid";
  if (count === 1) {
    namesEl.style.gridTemplateColumns = "none";
    namesEl.style.gridTemplateRows = "none";
  } else {
    var cols = Math.min(count, 3);
    var rows = Math.ceil(count / cols);
    namesEl.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
    namesEl.style.gridTemplateRows = "repeat(" + rows + ", minmax(0, 1fr))";
  }
  names.forEach(name => {
    const box = document.createElement("div");
    box.className = "namebox";
    const span = document.createElement("span");
    span.textContent = name || " ";
    box.appendChild(span);
    namesEl.appendChild(box);
  });
}

function updateAdminControls() {
  const allowed = ADMIN_MODE && currentUser && currentUser.email &&
    currentUser.email.toLowerCase() === ADMIN_EMAIL && currentUser.emailVerified;
  loginBtn.style.display = ADMIN_MODE && !currentUser ? "inline-block" : "none";
  editBtn.style.display = allowed ? "inline-block" : "none";
  logoutBtn.style.display = ADMIN_MODE && currentUser ? "inline-block" : "none";
  if (ADMIN_MODE && currentUser && !allowed) {
    setStatus("Denne Google-kontoen har ikke tilgang. Logg inn med " + ADMIN_EMAIL + ".");
  } else if (ADMIN_MODE && allowed) {
    setStatus("Innlogget som " + currentUser.email + ". Endringer synkroniseres med TV-en.");
  }
}
function edit() {
  if (!currentUser || currentUser.email.toLowerCase() !== ADMIN_EMAIL || !currentUser.emailVerified) {
    setStatus("Du må logge inn med riktig Google-konto først.");
    return;
  }
  while (fields.firstChild) fields.removeChild(fields.firstChild);
  names.forEach((name, index) => {
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.value = name;
    input.placeholder = "Navn " + (index + 1);
    input.maxLength = 48;
    const remove = document.createElement("button");
    remove.textContent = "Fjern";
    remove.onclick = () => {
      if (fields.children.length > 1) {
        if (row.parentNode) row.parentNode.removeChild(row);
        Array.from(fields.querySelectorAll("input")).forEach((el, i) => el.placeholder = "Navn " + (i + 1));
      }
    };
    row.appendChild(input);
    row.appendChild(remove);
    fields.appendChild(row);
  });
  editor.classList.add("open");
}

try {
  if (!window.firebase) throw new Error("Firebase-biblioteket ble ikke lastet. Sjekk internett/nettleser på TV-en.");
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();
  const namesRef = db.ref("birthdayDisplay/names");

  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
    if (Array.isArray(cached) && cached.length) names = cached.map(String);
  } catch (_) {}
  render();

  namesRef.on("value", snapshot => {
    const value = snapshot.val();
    if (Array.isArray(value)) names = value.map(v => String(v == null ? "" : v));
    else if (value && typeof value === "object") {
      names = Object.keys(value).sort((a,b) => Number(a)-Number(b)).map(k => String(value[k] == null ? "" : value[k]));
    } else names = ["Navn"];
    if (!names.length) names = ["Navn"];
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(names)); } catch (_) {}
    render();
    setStatus(ADMIN_MODE
      ? (currentUser ? "Tilkoblet. Endringer fra andre enheter vises automatisk." : "Tilkoblet databasen. Logg inn for å redigere.")
      : "Tilkoblet Firebase – navn synkronisert.");
  }, error => {
    console.error(error);
    setStatus("Firebase-feil: " + (error.message || error.code || "ukjent feil"));
  });

  loginBtn.onclick = function() {
    auth.signInWithPopup(provider).then(function(result) {
      const user = result.user;
      if (!user || !user.email || user.email.toLowerCase() !== ADMIN_EMAIL || !user.emailVerified) {
        return auth.signOut().then(function() {
          setStatus("Feil konto. Bruk " + ADMIN_EMAIL + ".");
        });
      }
    }).catch(function(error) {
      console.error(error);
      setStatus("Innlogging feilet: " + (error.message || error.code));
    });
  };
  logoutBtn.onclick = function() {
    auth.signOut().catch(error => setStatus(error.message || error.code));
  };
  auth.onAuthStateChanged(function(user) {
    currentUser = user;
    updateAdminControls();
  });
  editBtn.onclick = edit;

  document.getElementById("addBtn").onclick = function() {
    const row = document.createElement("div");
    row.className = "row";
    const input = document.createElement("input");
    input.placeholder = "Navn " + (fields.children.length + 1);
    input.maxLength = 48;
    const remove = document.createElement("button");
    remove.textContent = "Fjern";
    remove.onclick = function() { if (row.parentNode) row.parentNode.removeChild(row); };
    row.appendChild(input);
    row.appendChild(remove);
    fields.appendChild(row);
    input.focus();
  };
  document.getElementById("saveBtn").onclick = function() {
    if (!currentUser || !currentUser.email || currentUser.email.toLowerCase() !== ADMIN_EMAIL || !currentUser.emailVerified) {
      setStatus("Du må logge inn med " + ADMIN_EMAIL + ".");
      return;
    }
    const updated = Array.from(fields.querySelectorAll("input"))
      .map(input => input.value.trim()).filter(Boolean);
    if (!updated.length) updated.push("Navn");
    namesRef.set(updated).then(function() {
      names = updated;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(names)); } catch (_) {}
      render();
      editor.classList.remove("open");
      setStatus("Lagret! TV-en oppdateres automatisk.");
    }).catch(function(error) {
      console.error(error);
      setStatus("Kunne ikke lagre: " + (error.message || error.code));
    });
  };
  document.getElementById("cancelBtn").onclick = function() {
    editor.classList.remove("open");
  };
  if (!ADMIN_MODE) document.getElementById("toolbar").style.display = "none";
  setStatus("Firebase-bibliotek lastet – kobler til databasen …");
} catch (error) {
  console.error(error);
  setStatus("Oppstartsfeil: " + (error.message || error));
}
</script>
</body></html>
