<div id="screen"><div class="toolbar"><button class="toolbtn" id="editBtn">⚙ Rediger navn</button></div><section class="panel" id="panel"><h2>Rediger bursdagsnavn</h2><p class="hint">Skriv inn ett navn i hver boks. Endringene lagres automatisk på denne enheten.</p><div class="rows" id="rows"></div><div class="actions"><button class="secondary" id="addBtn">＋ Legg til boks</button><button class="primary" id="saveBtn">Lagre og lukk</button><button class="secondary" id="fullBtn">Fullskjerm</button></div></section>
<div class="heading-image" aria-hidden="true"></div><main class="names" id="names"></main></div>
<script>
const defaults=[''];let names=[];try{names=JSON.parse(localStorage.getItem('rushBirthdayNames')||'null')||defaults.slice()}catch(e){names=defaults.slice()}
const namesEl=document.getElementById('names'),rowsEl=document.getElementById('rows'),panel=document.getElementById('panel');
function render(){namesEl.innerHTML='';names.forEach((n,i)=>{const d=document.createElement('div');d.className='namebox'+(n.trim()?'':' empty');d.textContent=n.trim()||'BURSDAGSBARN';namesEl.appendChild(d)})}
function renderRows(){rowsEl.innerHTML='';names.forEach((n,i)=>{const r=document.createElement('div');r.className='row';const inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.placeholder='Navn '+(i+1);inp.value=n;inp.setAttribute('aria-label','Navn '+(i+1));inp.addEventListener('input',()=>{names[i]=inp.value;localStorage.setItem('rushBirthdayNames',JSON.stringify(names));render()});const del=document.createElement('button');del.textContent='×';del.title='Fjern boks';del.addEventListener('click',()=>{names.splice(i,1);localStorage.setItem('rushBirthdayNames',JSON.stringify(names));renderRows();render()});r.append(inp,del);rowsEl.appendChild(r)})}
document.getElementById('editBtn').addEventListener('click',()=>{renderRows();panel.classList.toggle('open')});document.getElementById('addBtn').addEventListener('click',()=>{names.push('');localStorage.setItem('rushBirthdayNames',JSON.stringify(names));renderRows();rowsEl.lastElementChild?.querySelector('input')?.focus()});document.getElementById('saveBtn').addEventListener('click',()=>{localStorage.setItem('rushBirthdayNames',JSON.stringify(names));panel.classList.remove('open');render()});document.getElementById('fullBtn').addEventListener('click',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()});render();
</script></body></html>
